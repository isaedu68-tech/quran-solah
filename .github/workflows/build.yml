# App "Quran & Solah" (giờ Solah + nhắc, đọc Quran + dịch Việt, học thuộc, Qibla): đóng gói APK riêng và gửi vào Telegram
name: Đóng gói Quran & Solah

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NO: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Dữ liệu Quran: tải một lần rồi lưu cache (văn bản Tanzil, bản dịch Rowwad/QuranEnc, phông Amiri Quran)
      - uses: actions/cache@v4
        id: qdata
        with:
          path: qdata
          key: quran-data-v1

      - name: Tải dữ liệu Quran
        if: steps.qdata.outputs.cache-hit != 'true'
        run: python3 app/tools/prep_data.py

      - name: Chép dữ liệu vào app
        run: |
          mkdir -p app/src/main/assets
          cp qdata/quran.txt qdata/vi.txt qdata/suras.tsv qdata/AmiriQuran.ttf app/src/main/assets/
          ls -la app/src/main/assets

      - name: Kiểm thử + đóng gói
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease 2>&1 | tee gradle.log
      - name: Ghi lỗi biên dịch thành chú thích
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong" -A2 gradle.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Đặt tên file
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/QuranSolah-0.1.${BUILD_NO}.apk"

      - name: Đăng bản mới
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quran-v0.1.${{ github.run_number }}
          name: Quran & Solah 0.1.${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            App Quran & Solah: giờ Solah + nhắc, đọc Quran + dịch Việt, học thuộc, Qibla. Tải file QuranSolah-….apk bằng điện thoại rồi mở để cài.
          files: out/*.apk
          make_latest: false

      - name: Gửi APK vào Telegram
        if: success()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          f=$(ls out/*.apk | head -1)
          cap=$(printf '🕌 Quran & Solah 0.1.%s\n\n%s\n\nBấm vào file để cài. Cài đè lên bản cũ, giữ nguyên dữ liệu.' "$BUILD_NO" "$(printf '%s' "${MSG:-Build thủ công}" | grep -v -i -e "^co-authored-by" -e "^claude-session" -e "http" | sed "/^$/d" | head -4)")
          bash .github/scripts/tg.sh doc "$f" "$cap"

      - name: Báo lỗi build vào Telegram
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/tg.sh msg "❌ Build Quran & Solah #$BUILD_NO lỗi — Claude đang xem: $URL"
